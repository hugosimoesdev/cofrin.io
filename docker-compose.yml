services:
  postgres:
    image: postgres:17-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: cofrin
      POSTGRES_USER: cofrin
      POSTGRES_PASSWORD: cofrin
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cofrin -d cofrin"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:

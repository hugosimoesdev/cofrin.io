services:
  postgres:
    image: postgres:17-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: cofrin
      POSTGRES_USER: cofrin
      POSTGRES_PASSWORD: cofrin
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cofrin -d cofrin"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    image: maven:3.9.9-eclipse-temurin-21
    working_dir: /workspace/apps/backend
    command: ./mvnw quarkus:dev -Dquarkus.http.host=0.0.0.0 -Dquarkus.analytics.disabled=true
    ports:
      - "8080:8080"
    environment:
      DATABASE_JDBC_URL: jdbc:postgresql://postgres:5432/cofrin
      POSTGRES_USER: cofrin
      POSTGRES_PASSWORD: cofrin
    volumes:
      - .:/workspace
      - maven-cache:/root/.m2
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    image: node:24-alpine
    working_dir: /workspace
    command: sh -c "npm install && npm run dev:frontend"
    ports:
      - "5173:5173"
    volumes:
      - .:/workspace
      - node-modules:/workspace/node_modules
      - frontend-node-modules:/workspace/apps/frontend/node_modules
    environment:
      VITE_API_BASE_URL: http://backend:8080
    depends_on:
      - backend

volumes:
  postgres-data:
  maven-cache:
  node-modules:
  frontend-node-modules:

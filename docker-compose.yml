services:
  backend:
    image: maven:3.9.9-eclipse-temurin-21
    working_dir: /workspace/apps/backend
    command: ./mvnw quarkus:dev -Dquarkus.http.host=0.0.0.0 -Dquarkus.analytics.disabled=true
    ports:
      - "8080:8080"
    volumes:
      - .:/workspace
      - maven-cache:/root/.m2

  frontend:
    image: node:24-alpine
    working_dir: /workspace
    command: sh -c "npm install && npm run dev:frontend"
    ports:
      - "5173:5173"
    volumes:
      - .:/workspace
      - node-modules:/workspace/node_modules
      - frontend-node-modules:/workspace/apps/frontend/node_modules
    environment:
      VITE_API_BASE_URL: http://backend:8080
    depends_on:
      - backend

volumes:
  maven-cache:
  node-modules:
  frontend-node-modules:

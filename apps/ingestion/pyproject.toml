[project]
name = "cofrin-ingestion"
version = "0.1.0"
description = "File ingestion service for cofrin.io financial imports."
requires-python = ">=3.9"
dependencies = [
    "fastapi>=0.124.0,<1.0.0",
    "pydantic>=2.12.0,<3.0.0",
    "python-multipart>=0.0.20,<1.0.0",
    "uvicorn[standard]>=0.38.0,<1.0.0",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.28.0,<1.0.0",
    "pytest>=8.4.0,<9.0.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

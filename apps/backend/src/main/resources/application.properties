quarkus.application.name=cofrin-backend
quarkus.http.cors.enabled=true
quarkus.http.cors.origins=http://localhost:5173
quarkus.http.cors.methods=GET,POST,PUT,PATCH,DELETE,OPTIONS
quarkus.http.cors.headers=accept,authorization,content-type,x-requested-with

quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=${POSTGRES_USER:cofrin}
quarkus.datasource.password=${POSTGRES_PASSWORD:cofrin}
quarkus.flyway.migrate-at-start=true

%dev.quarkus.datasource.jdbc.url=${DATABASE_JDBC_URL:jdbc:postgresql://localhost:5432/cofrin}
%prod.quarkus.datasource.jdbc.url=${DATABASE_JDBC_URL}
